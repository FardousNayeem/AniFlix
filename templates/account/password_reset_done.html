{% extends "account/base_entrance.html" %}

{% block title %}Check your inbox - {{ SITE_NAME }}{% endblock %}

{% block entrance %}
  <header>
    <span class="empty__icon"><i class="ph ph-envelope-simple" aria-hidden="true"></i></span>
    <h1 class="auth__title" style="margin-top: var(--space-4)">Check your inbox</h1>
    <p class="auth__sub">If an account exists for that address, a reset link is on its way.</p>
  </header>

  <a class="btn btn--ghost btn--block" href="{% url 'account_login' %}">Back to sign in</a>
{% endblock %}
