{% extends "account/base_entrance.html" %}

{% block title %}Password updated - {{ SITE_NAME }}{% endblock %}

{% block entrance %}
  <header>
    <span class="empty__icon"><i class="ph ph-check-circle" aria-hidden="true"></i></span>
    <h1 class="auth__title" style="margin-top: var(--space-4)">Password updated</h1>
    <p class="auth__sub">You can sign in with your new password now.</p>
  </header>

  <a class="btn btn--primary btn--block" href="{% url 'account_login' %}">Sign in</a>
{% endblock %}
