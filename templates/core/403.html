{% extends "base.html" %}

{% block title %}Not allowed - {{ SITE_NAME }}{% endblock %}

{% block body %}
  <div class="error-page">
    <p class="error-page__code">403</p>
    <h1>That is not yours to open</h1>
    <p class="text-muted measure">You do not have access to this page. If you think that is wrong, sign in with the right account.</p>
    <div class="row" style="justify-content: center; margin-top: var(--space-4)">
      <a class="btn btn--primary" href="{% url 'streaming:home' %}">Back to home</a>
      <a class="btn btn--ghost" href="{% url 'account_login' %}">Sign in</a>
    </div>
  </div>
{% endblock %}
