{% extends "base.html" %}

{% block title %}Something went wrong - {{ SITE_NAME }}{% endblock %}

{% block body %}
  <div class="error-page">
    <p class="error-page__code">500</p>
    <h1>Something broke on our side</h1>
    <p class="text-muted measure">This one is on us, not you. The error has been logged. Try again in a moment.</p>
    <div class="row" style="justify-content: center; margin-top: var(--space-4)">
      <a class="btn btn--primary" href="{% url 'streaming:home' %}">Back to home</a>
    </div>
  </div>
{% endblock %}
