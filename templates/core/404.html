{% extends "base.html" %}

{% block title %}Page not found - {{ SITE_NAME }}{% endblock %}

{% block body %}
  <div class="error-page">
    <p class="error-page__code">404</p>
    <h1>This page took a different arc</h1>
    <p class="text-muted measure">The link is broken or the title was removed. Everything else is still where you left it.</p>
    <div class="row" style="justify-content: center; margin-top: var(--space-4)">
      <a class="btn btn--primary" href="{% url 'streaming:home' %}">Back to home</a>
      <a class="btn btn--ghost" href="{% url 'streaming:browse' %}">Browse the catalogue</a>
    </div>
  </div>
{% endblock %}
